# Surface Laptop 7 (Intel) touchpad tuning for iptsd.
#
# This is the TUNED file for this host -- it supersedes the community's starting
# point (which used 20/16). Do not replace it with the upstream/community sample,
# or the "two fingers held close together" fix is lost.
#
# Pad: QuickSPI 045E:0C9F (Sensel haptic). Runs on the alex-lentz iptsd fork
# (physical Sensel click + button debounce + anti-teleport tracker guard) plus the
# LiftGraceMs patch. See ../HARDWARE-surface-laptop-7.md for the full story.
#
# Threshold trade-off on this sensor:
#   - Contacts vanishing mid-slide (flicker -> phantom tap/drag in libinput) happen
#     when a finger's heatmap value dips below the DEACTIVATION threshold, so LOWER
#     thresholds keep contacts alive.
#   - Two fingertips held close together merge into ONE blob (so two-finger scroll
#     and two-finger tap never register) when the valley between the peaks does not
#     fall below the deactivation threshold or rise back across the activation
#     threshold -- see contacts/detection/algorithms/cluster.hpp. HIGHER thresholds
#     separate better.
# These pull opposite ways. LiftGraceMs covers the downside of the higher pair, so
# 24/20 is what this host runs.
#
# Community's measured failure history for this pad, so nobody retries these:
#   24/20 without any grace period: light-touch slides flicker into ghost taps
#   16/12: noise detected as contacts (20-45 mm position teleports)
#   20/14: sticky contacts (2-3 s release lag, taps rejected)
#   20/18: contact fragmenting (8 taps become 54 touch sessions)
#   Neutral=average + NeutralValue=10 (SLS2 recipe): heavy jitter, taps rejected
#   PeakSuppressionRadius >= 2: do NOT enable, it suppresses the real second finger
#
# On [Device] below: it is OPTIONAL. config-loader seeds the vendor/product match
# from the current device and only overwrites them if the file declares them, so a
# file WITHOUT [Device] applies to every device, while this one is scoped to this pad.

[Device]
Vendor = 0x045E
Product = 0x0C9F

[Contacts]
ActivationThreshold = 24
DeactivationThreshold = 20

[Touchpad]
ButtonDebounceMs = 30

# A contact that disappears is not reported as lifted until it has been gone this
# long. Bridges the single-frame detection dropouts that cause phantom tap-clicks
# while sliding and phantom click-drag (tap-then-down) in libinput. 70 ms still let
# rare ghosts through; 110 ms was fully clean; 80 is the daily value here.
LiftGraceMs = 80
