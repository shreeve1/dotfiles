## Drop-in shared by xdg-desktop-portal, -hyprland and -gtk (linked into each
## unit's .service.d/ by install.sh).
##
## Screen sharing hands frames over PipeWire. The portals connect once at
## startup and never reconnect, so any PipeWire restart leaves them "running"
## but serving an empty share picker ("Caught PipeWire error: connection
## error" in the xdg-desktop-portal log). PartOf= makes a stop/restart of
## pipewire.service propagate here; After= restarts us once PipeWire is up.
##
## Caveat: PartOf= propagates stop too. After a bare `systemctl --user stop
## pipewire` the portals stay down until next login or `audio-reset`.
## Restart=on-failure covers portal crashes (the -hyprland unit already has it).

[Unit]
PartOf=pipewire.service
After=pipewire.service

[Service]
Restart=on-failure
RestartSec=1
