## Persist Bluetooth state without automatically switching profiles. Do not
## force-connect or autoswitch A2DP and HFP/HSP transports: some headsets,
## including HD65, reject competing transport acquisition and reconnect.

wireplumber.settings = {
  bluetooth.use-persistent-storage = true
  bluetooth.autoswitch-to-headset-profile = false
  device.restore-profile = true
  device.restore-routes = true
  node.restore-default-targets = true
}
