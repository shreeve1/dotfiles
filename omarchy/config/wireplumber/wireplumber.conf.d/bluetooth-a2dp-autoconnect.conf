## Persist Bluetooth state. Auto-switch A2DP <-> HSP/HFP so the mic is always
## visible and the profile flips only while an app records (Windows/macOS
## style). If the HD65 rejects transports again, set autoswitch back to false.

wireplumber.settings = {
  bluetooth.use-persistent-storage = true
  bluetooth.autoswitch-to-headset-profile = true
  device.restore-profile = true
  device.restore-routes = true
  node.restore-default-targets = true
}
