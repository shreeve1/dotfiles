# Skill Router Sharp Edges
# Traps when dispatching to the spawner skill library

sharp_edges:
  - id: stale-path-layout
    title: Stale Path Layout
    severity: high
    situation: |
      GETTING_STARTED.md examples cite paths like
      ~/.spawner/skills/development/backend/skill.yaml, but the installed
      library is flat by category (backend/, frontend/, ai/ at the top
      level). Announcing a path from docs yields a file-not-found.
    why: |
      The upstream repo reorganized into top-level categories; older docs
      and blog posts still use the nested layout.
    solution: |
      Always ls the category directory or find by skill name before
      announcing a path. Never quote a path from memory or docs.
    symptoms:
      - 'No such file error when loading skill.yaml'
      - Skill name announced but wrong category
    detection_pattern: "development/|integration/|agents/"

  - id: near-duplicate-skills
    title: Near-Duplicate Skills
    severity: medium
    situation: |
      Library contains overlapping pairs: testing/code-review vs
      testing/code-reviewer, backend/websocket-realtime vs
      backend/websockets-realtime. Router picks the stale twin or loads both.
    why: |
      The library grew by accretion; several duplicates were never merged.
    solution: |
      When two names differ only slightly, read both skill.yaml
      descriptions and pick the one with richer patterns (more files,
      longer identity). Load exactly one.
    symptoms:
      - Two loaded experts contradict each other
      - Loaded skill with no sharp-edges content
    detection_pattern: "reviewer|websockets"

  - id: confirmation-theater
    title: Confirmation Theater
    severity: medium
    situation: |
      Router shows the SKILL LOADED box but answers with generic advice
      that ignores the skill's patterns and sharp edges.
    why: |
      The box is verification for the user, not a substitute for adoption.
      Copying the ritual without the content is worse than not loading.
    solution: |
      After loading, every recommendation must trace to a loaded pattern,
      and every flagged risk should map to a loaded sharp edge. If none
      apply, the wrong skill was selected — re-route.
    symptoms:
      - Loaded expert gives advice absent from its skill.yaml
      - Sharp edges never mentioned again after the box
    detection_pattern: "best practice|generally recommended"
