[[opener]]
id = "edit"
run = "${EDITOR:-nvim} %*"
block = true
desc = "Edit with $EDITOR"

[[opener]]
id = "open"
run = "xdg-open %*"
desc = "System open"

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { mime = "application/json", use = "edit" },
  { mime = "application/x-shellscript", use = "edit" },
  { mime = "application/javascript", use = "edit" },
  { mime = "application/toml", use = "edit" },
  { mime = "application/yaml", use = "edit" },
  { mime = "application/x-yaml", use = "edit" },
  { name = "*.toml", use = "edit" },
  { name = "*.yaml", use = "edit" },
  { name = "*.yml", use = "edit" },
  { name = "*.json", use = "edit" },
  { name = "*.md", use = "edit" },
  { name = "*.conf", use = "edit" },
  { name = "*.cfg", use = "edit" },
  { name = "*.ini", use = "edit" },
  { name = "*.css", use = "edit" },
  { name = "*.html", use = "edit" },
  { name = "*.js", use = "edit" },
  { name = "*.ts", use = "edit" },
  { name = "*.tsx", use = "edit" },
  { name = "*.jsx", use = "edit" },
  { name = "*.py", use = "edit" },
  { name = "*.rs", use = "edit" },
  { name = "*.go", use = "edit" },
  { name = "*.sh", use = "edit" },
  { name = "*.bash", use = "edit" },
  { name = "*.zsh", use = "edit" },
  { name = "*.lua", use = "edit" },
  { name = "*.vim", use = "edit" },
  { name = "*.nix", use = "edit" },
  { name = "*.lock", use = "edit" },
  { name = "*.gitignore", use = "edit" },
  { name = "*.env", use = "edit" },
  { name = "*.example", use = "edit" },
  { name = "*.log", use = "edit" },
  { name = "*.txt", use = "edit" },
]
