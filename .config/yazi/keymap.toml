[mgr]
prepend_keymap = [
  { on = "<Enter>", run = "plugin smart-enter", desc = "Enter directory or open file" },
  { on = "l", run = "plugin smart-enter", desc = "Enter directory or open file" },
  # Copy hovered file's full path to the LOCAL clipboard (OSC 52, works over SSH)
  { on = [
    "c",
    "p",
  ], run = "plugin pull -- path", desc = "Copy path to clipboard" },
  # Copy hovered file's name only
  { on = [
    "c",
    "n",
  ], run = "plugin pull -- name", desc = "Copy filename to clipboard" },
  # Copy a ready-to-paste `scp -r <user>@<host>:<hovered> .` to the LOCAL clipboard —
  # paste on the machine you SSH'd FROM to pull this file/folder over.
  { on = [
    "c",
    "c",
  ], run = "plugin pull -- scp", desc = "Copy scp pull command to clipboard" },
  # Browse a remote host over SFTP in this local yazi (see vfs.toml).
  # Yank a remote file here, switch to a local tab, paste → downloads it.
  { on = [
    "g",
    "a",
  ], run = "cd sftp://aidev", desc = "Go to aidev (SFTP)" },
  { on = [
    "g",
    "n",
  ], run = "cd sftp://itan8n", desc = "Go to itan8n (SFTP)" },
]
