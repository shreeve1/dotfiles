set -g mouse on
set -g focus-events on
set -g prefix C-s
unbind C-b
bind C-s send-prefix

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# ── Catppuccin Mocha ──────────────────────────────────────
set -g status on
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Window tabs
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style "fg=#6c7086,bg=#1e1e2e"
set -g window-status-current-style "fg=#1e1e2e,bg=#cba6f7,bold"
set -g window-status-separator ""

# Status left — session name
set -g status-left-length 30
set -g status-left "#[fg=#1e1e2e,bg=#cba6f7,bold] #S #[fg=#cba6f7,bg=#1e1e2e,nobold]"

# Status right — time + date
set -g status-right-length 50
set -g status-right "#[fg=#313244,bg=#1e1e2e]#[fg=#cdd6f4,bg=#313244] %H:%M  %d %b "

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Message / command prompt
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
