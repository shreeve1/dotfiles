setupVersion: 2
modelRoles:
  default: openai-codex/gpt-5.6-terra:medium
  vision: cliproxy/claude-sonnet-4-6:high
  advisor: openai-codex/gpt-5.6-sol:medium
  task: openrouter/deepseek/deepseek-v4.1-flash:low
  slow: cliproxy/claude-opus-5-5:medium
  designer: cliproxy/claude-opus-4-8:high
  commit: openrouter/deepseek/deepseek-v4.1-flash:low
  tiny: openrouter/deepseek/deepseek-v4.1-flash:low
  plan: cliproxy/claude-opus-5-5:high
  smol: openrouter/deepseek/deepseek-v4.1-flash:low
  memory: openrouter/deepseek/deepseek-v4.1-flash:low
  judge: openrouter/deepseek/deepseek-v4.1-flash:low
theme:
  dark: neon80s
statusLine:
  separator: powerline
  preset: default
memory:
  backend: sharpshooter
autolearn:
  enabled: true
  autoContinue: true
astGrep:
  enabled: true
task:
  eager: always
  enableLsp: true
  agentModelOverrides:
    scout: "@smol"
    task: "@task"
    reviewer: deepseek/deepseek-v4-flash:high
    planner: "@plan"
  enableEffort: true
composer:
  shape: borderless
advisor:
  enabled: true
  syncBacklog: "1"
prewalk:
  enabled: true
compaction:
  midTurnEnabled: true
  experimentalContextManagement: false
  methodOrder:
    - handoff
    - remote
    - snapcompact
    - soft
    - shake
commands:
  enableClaudeProject: false
  enableOpencodeProject: false