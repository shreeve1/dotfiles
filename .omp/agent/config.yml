setupVersion: 2
modelRoles:
  vision: cliproxy/claude-sonnet-4-6:high
  advisor: openrouter/deepseek/deepseek-v4.1-flash:low
  task: openrouter/deepseek/deepseek-v4.1-flash:low
  slow: cliproxy/claude-opus-5-5:medium
  designer: cliproxy/claude-opus-4-8:high
  commit: openrouter/deepseek/deepseek-v4.1-flash:low
  tiny: openrouter/deepseek/deepseek-v4.1-flash:low
  plan: cliproxy/claude-opus-5-5:medium
  smol: openrouter/deepseek/deepseek-v4.1-flash:low
  default: openrouter/deepseek/deepseek-v4.1-flash:low
  judge: openrouter/deepseek/deepseek-v4.1-flash:high
  web: openai-codex/gpt-5.6-terra:medium
  memory: openrouter/deepseek/deepseek-v4.1-flash:low
theme:
  dark: neon80s
statusLine:
  separator: powerline
  preset: default
  transparent: true
memory:
  backend: sharpshooter
autolearn:
  enabled: true
  autoContinue: true
astGrep:
  enabled: true
task:
  eager: always
  maxConcurrency: 4
  enableLsp: false
  agentModelOverrides:
    scout: "@smol"
    task: "@task"
    reviewer: deepseek/deepseek-v4-flash:high
    planner: "@plan"
  enableEffort: true
composer:
  shape: borderless
compaction:
  methodOrder:
    - remote
    - snapcompact
    - shake
    - soft
bash:
  enabled: true
commands:
  enableClaudeProject: false
  enableOpencodeProject: false
advisor:
  enabled: true
  syncBacklog: "1"
prewalk:
  enabled: true
retry:
  waitForUsageReset: true
  usageAwareFallback: false
personality: pragmatic
defaultThinkingLevel: medium
dev:
  autoqaConsent: denied