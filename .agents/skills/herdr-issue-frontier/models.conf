# herdr-issue-frontier — model tiers (EDIT THIS FILE)
#
# This is the source of truth for which models worker and reviewer panes use,
# in priority order. Sourced by the skill before each wave.
#
# Each value is a comma-separated, ordered list. The primitive probes every
# model in the list with one tiny call and uses the FIRST that responds cleanly,
# so a model that is out of quota / unauthorized / unavailable / not found
# automatically falls back to the next. (Disable probing with
# HERDR_ORCH_MODEL_PROBE=0 — then the first entry is used with no call.)
#
# PER-PROJECT OVERRIDE: create `$PROJECT/.herdr-frontier-models` (same format).
# It takes precedence over this synced default, so different projects can use
# different model tiers without editing the shared skill. Leave an entry's
# quotes empty ("") to disable probing and fall back to the primitive default
# (worker: minimax/MiniMax-M3, reviewer: deepseek/deepseek-v4-flash).
#
# Find model ids with:  pi --list-models

# Worker tier — primary first. (Worker does the implementation: edits + tests.)
HERDR_FRONTIER_WORKER_MODELS="minimax/MiniMax-M3,deepseek/deepseek-v4-flash"

# Reviewer tier — primary first, ideally the OPPOSITE family from the worker
# primary so the independent review isn't biased by the same model.
HERDR_FRONTIER_REVIEWER_MODELS="deepseek/deepseek-v4-flash,minimax/MiniMax-M3"
